const pl=Panel($("#stage"),{W:860,H:470,m:{l:58,r:22,t:14,b:44},y:[10,50,10],xt:[1950,1975,2000,2025,2050,2075,2100],xtitle:"Year",ytitle:"Median age (years)",series:S,label:"Median age by region, 1950 to 2100",
 onHover:(y,e,i)=>{const rows=S.filter(s=>!pl.S.find(a=>a.s===s).g.classList.contains("off")).sort((a,b)=>b.vals[i]-a.vals[i]);
  showTip(`<div class="h"><div><b>${y}</b><small>${y>PROJ?"Projection":"Observed data"}</small></div></div>`+rows.map(s=>`<div class="r">${badge(s.flag,s.color)}<span>${s.name}</span><strong>${fmt(s.vals[i])}</strong></div>`).join(""),e)}});
P.subs.push(pl.draw);
$("#chips").innerHTML=S.map(s=>`<button class="chip" style="--c:${col(s.color)}" data-k="${s.key}" aria-pressed="true"><i></i>${s.name}</button>`).join("");
document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{const off=!b.classList.toggle("off");b.setAttribute("aria-pressed",off);pl.show(b.dataset.k,off)});
start();
</script></body></html>
