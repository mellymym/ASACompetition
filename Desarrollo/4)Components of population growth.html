<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Components of population growth</title><style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5b6472;--line:#e3e6eb;--grid:#eceef2;--shadow:0 1px 2px rgba(20,23,28,.05),0 8px 24px rgba(20,23,28,.06);
--blue:#1f77b4;--red:#d62728;--green:#2ca02c;--orange:#ff7f0e;--violet:#9467bd;--lime:#a6c800;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--card:#181c23;--ink:#eef1f5;--mute:#9aa3b2;--line:#272d37;--grid:#222832;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1217;--card:#181c23;--ink:#eef1f5;--mute:#9aa3b2;--line:#272d37;--grid:#222832;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ttl{display:flex;flex-direction:column;min-width:0}.ttl b{font-size:16px;letter-spacing:-.01em}.ttl span{color:var(--mute);font-size:13px}
.ctrl{display:flex;gap:8px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{background:var(--grid)}.btn:active{transform:scale(.96)}.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center}
.year{font-size:clamp(56px,13vw,108px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.side{display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:opacity .25s,background .2s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--mute))}
.chip.off{opacity:.45}.chip.off i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.chip.static{cursor:default;background:var(--grid)}.chip.live{background:var(--lime);border-color:var(--lime);color:#1b2200}
.chip.sp[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--blue)}
.plot{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.plot text{fill:var(--mute);font-size:11px;font-family:inherit}.plot .ax{font-size:12px}
.plot .gl{stroke:var(--grid);stroke-width:1}.plot .band{fill:var(--lime);opacity:.07}
.plot .xl{stroke:var(--mute);stroke-dasharray:4 4;opacity:.7}.plot .zr{stroke:var(--mute);stroke-dasharray:6 4;opacity:.55}
.plot .ghost{fill:none;stroke-width:2.4;opacity:.2;stroke-linejoin:round}.plot .live{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.plot .dot{stroke:var(--card);stroke-width:2.5}.plot .hdot{stroke:var(--card);stroke-width:2}
.plot .hl{stroke:var(--ink);opacity:.3}
.plot g.s{transition:opacity .35s}.plot g.s.off{opacity:0}.leaving .live,.leaving .dot,.leaving .ghost{opacity:0!important}
.live,.dot,.ghost{transition:opacity .35s}
.note{color:var(--mute);font-size:12.5px;margin:2px 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid .card{padding:12px}.ph{display:flex;align-items:center;gap:10px;margin-bottom:4px;font-weight:700;font-size:14px}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--grid);box-shadow:0 0 0 2px var(--c,var(--line));font-size:17px;line-height:1;flex:none}
.tip{position:fixed;z-index:20;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;min-width:170px;font-size:13px}
.tip.on{opacity:1}.tip .h{display:flex;align-items:center;gap:10px;margin-bottom:6px}.tip .h b{font-size:14px;display:block}.tip .h small{color:var(--mute)}
.tip .r{display:flex;align-items:center;gap:8px;padding:2px 0}.tip .r .badge{width:20px;height:20px;font-size:11px}.tip .r span{flex:1}.tip .r strong{font-variant-numeric:tabular-nums}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:540px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}*{transition:none!important}}
</style></head><body>
<header class="bar"><div class="bar-in"><div class="ttl"><b>Components of population growth</b><span>Natural change vs. net migration (per 1,000 inhabitants)</span></div>
<div class="ctrl"><button class="btn pri" id="play">▶ Play</button><button class="btn" id="rst">↺ Restart</button></div></div></header>
<main>
<section class="card hero rise" style="--i:0"><div class="year" id="year">1950</div>
<div class="side"><div class="row"><span class="chip static live" id="phase">Observed data</span>
<button class="chip sp" data-v="8.5" aria-pressed="false">0.5×</button><button class="chip sp" data-v="17" aria-pressed="true">1×</button><button class="chip sp" data-v="34" aria-pressed="false">2×</button></div>
<input type="range" id="scrub" min="1950" max="2100" step="1" value="1950" aria-label="Year"></div></section>
<section class="row rise" style="--i:1" id="chips"></section>
<section class="grid" id="stage"></section>
<p class="note rise" style="--i:4">Source: UN, World Population Prospects. Vertical dotted line: start of projections.</p></main>
<div class="tip" id="tip"></div>
